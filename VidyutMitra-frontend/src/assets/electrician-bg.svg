<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground shadow -->
  <ellipse cx="150" cy="500" rx="80" ry="14" fill="#191534" opacity="0.14"/>

  <!-- back arm, holding a coil of wire -->
  <path d="M100 262 Q60 300 55 360 Q50 400 70 420" stroke="#C98F5E" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="66" cy="425" r="16" fill="none" stroke="#FF7A50" stroke-width="6"/>
  <circle cx="66" cy="425" r="9" fill="none" stroke="#FF7A50" stroke-width="5"/>

  <!-- legs / dhoti -->
  <path d="M115 330 L95 500 L135 500 L145 360 L155 360 L165 500 L205 500 L185 330 Z" fill="#2E2750"/>
  <path d="M120 350 L108 480 M180 350 L192 480" stroke="#1B1633" stroke-width="3" opacity="0.5"/>

  <!-- bare feet -->
  <ellipse cx="110" cy="505" rx="20" ry="8" fill="#3A2E1A"/>
  <ellipse cx="190" cy="505" rx="20" ry="8" fill="#3A2E1A"/>

  <!-- torso / kurta -->
  <path d="M110 250 Q150 225 190 250 L200 340 Q150 360 100 340 Z" fill="#6C4CF1"/>

  <!-- gamcha (checked cloth) draped across the shoulder -->
  <g transform="rotate(18 108 300)">
    <rect x="95" y="245" width="26" height="120" fill="#FF7A50"/>
    <g opacity="0.55">
      <rect x="95" y="245" width="26" height="10" fill="#ffffff"/>
      <rect x="95" y="270" width="26" height="10" fill="#ffffff"/>
      <rect x="95" y="295" width="26" height="10" fill="#ffffff"/>
      <rect x="95" y="320" width="26" height="10" fill="#ffffff"/>
      <rect x="95" y="345" width="26" height="10" fill="#ffffff"/>
    </g>
  </g>

  <!-- raised arm, holding a wrench -->
  <path d="M195 260 Q235 240 245 195" stroke="#C98F5E" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="247" cy="188" r="12" fill="#C98F5E"/>
  <g transform="translate(247 165) rotate(-25)">
    <rect x="-5" y="-40" width="10" height="55" rx="4" fill="#0EA5A4"/>
    <circle cx="0" cy="-42" r="12" fill="none" stroke="#0EA5A4" stroke-width="7"/>
    <rect x="-7" y="10" width="14" height="10" rx="2" fill="#0B7F7E"/>
  </g>

  <!-- neck -->
  <rect x="138" y="225" width="24" height="25" rx="6" fill="#C98F5E"/>

  <!-- head -->
  <circle cx="150" cy="195" r="38" fill="#C98F5E"/>
  <circle cx="112" cy="197" r="7" fill="#C98F5E"/>
  <circle cx="188" cy="197" r="7" fill="#C98F5E"/>

  <!-- mustache -->
  <path d="M128 208 Q150 222 172 208 Q150 216 128 208 Z" fill="#2B2140"/>

  <!-- eyes -->
  <circle cx="136" cy="188" r="3.5" fill="#2B2140"/>
  <circle cx="164" cy="188" r="3.5" fill="#2B2140"/>

  <!-- simple rounded cap -->
  <path d="M108 178 Q150 140 192 178 Q192 190 150 186 Q108 190 108 178 Z" fill="#FFFFFF" stroke="#E4E2F5" stroke-width="2"/>
</svg>